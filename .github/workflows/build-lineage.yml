name: Build LineageOS 23.2 (x86 ISO)

on:
  workflow_dispatch: # Menggunakan trigger manual agar tidak otomatis build setiap ada push

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Membersihkan penyimpanan (Free Disk Space)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true  # Hapus SDK Android bawaan runner karena kita butuh ruang kosong
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Menginstal Dependensi Sistem
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Menginstal Tool 'repo'
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Konfigurasi Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Inisialisasi Repository LineageOS
      run: |
        mkdir -p ~/lineageos_x86
        cd ~/lineageos_x86
        # Menggunakan --depth=1 untuk menghemat puluhan GB penyimpanan
        repo init -u https://github.com/LineageOS/android.git -b lineage-23.2 --depth=1

    - name: Sinkronisasi Source Code (Repo Sync)
      run: |
        cd ~/lineageos_x86
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Kompilasi (Build ISO)
      run: |
        cd ~/lineageos_x86
        source build/envsetup.sh
        lunch lineage_x86-userdebug
        mka iso_img -j$(nproc --all)

    - name: Mengunggah Hasil Build (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-23.2-x86-ISO
        path: ~/lineageos_x86/out/target/product/x86/*.iso
